[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
yaltri-core = { path = "crates/yaltri-core" }
yaltri-calc = { path = "crates/yaltri-calc" }
yaltri-platform = { path = "crates/yaltri-platform" }
yaltri-files = { path = "crates/yaltri-files" }
yaltri-apps = { path = "crates/yaltri-apps" }
yaltri-color = { path = "crates/yaltri-color" }

# GPUI Kit pins the matching gpui-pre snapshot and re-exports GPUI + components.
# Exact pin: bump deliberately, GPUI is pre-1.0 and breaks between snapshots.
gpui-kit = "=0.9.1"

anyhow = "1"
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screenshot", "global_shortcuts"] }
directories = "6"
fend-core = "1.5"
futures = "0.3"
global-hotkey = "0.10"
# Pure Rust backends: no hidapi C library, no libudev on Linux.
hidapi = { version = "2.6", default-features = false, features = ["windows-native", "linux-native-basic-udev"] }
image = { version = "0.25", default-features = false, features = ["png"] }
interprocess = "2.4"
jwalk = "0.9"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
memchr = "2.8"
notify = "8.2"
nucleo-matcher = "0.3"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
sys-locale = "0.3"
resvg = { version = "0.50", default-features = false }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
x11rb = { version = "0.14", features = ["randr", "shape"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }
# zbus 5 (as ksni uses it): 6 has no blocking API.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_Graphics_Dwm"] }

[profile.dev.package."*"]
opt-level = 2

# The file index scans millions of names; keep it fast in debug builds too.
[profile.dev.package.yaltri-files]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
