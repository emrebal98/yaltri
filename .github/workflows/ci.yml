name: CI

# Pull requests are checked here. Pushes to main (merges) run it too, to
# keep main's build cache warm: a pull request can only restore caches
# saved on its own ref or on main, so without main's cache every pull
# request compiled everything from scratch (~40 min on Linux).
on:
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

# A newer push to a pull request replaces its running check; runs on main
# finish, so each merge leaves a saved cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libdbus-1-dev

      - name: Release config lists every crate
        if: runner.os == 'Linux'
        run: sh scripts/check-release-config.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Only main saves (pull requests restore main's): each saved cache is
      # 1-1.5 GB, and per-PR copies filled the repo's 10 GB cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked
