name: Release

# release-please watches main. Every merged `feat`/`fix`/`perf` PR updates one
# open "chore(main): release x.y.z" PR: the next version (feat -> minor, fix ->
# patch; while on 0.x a breaking change also bumps minor), CHANGELOG.md and the
# crate versions in Cargo.toml / Cargo.lock. Nothing is released until that PR
# is merged. Merging it creates the tag and a draft GitHub release; the jobs
# below build the Windows and Linux packages, attach them, and publish it.
#
# `workflow_dispatch` only builds the packages (as workflow artifacts), to try
# the pipeline without releasing anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Oldest supported Ubuntu: the binary runs on its glibc (2.35) and newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag || github.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build
        run: cargo build --release --locked -p yaltri --target ${{ matrix.target }}

      # Version-less names keep `releases/latest/download/<asset>` links stable.
      # Windows ships the bare executable: run it and it installs itself.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/yaltri.exe yaltri.exe
          (Get-FileHash yaltri.exe -Algorithm SHA256).Hash.ToLower() + "  yaltri.exe" | Out-File -Encoding ascii yaltri.exe.sha256
          "ASSET=yaltri.exe" >> $env:GITHUB_ENV

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="yaltri-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/yaltri README.md README.tr.md LICENSE "$name/"
          cp assets/icons/LICENSE "$name/LICENSE-lucide"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          # The one-line installer is served from the release too (copied to
          # the root so the artifact keeps every file at the top level).
          cp scripts/install.sh install.sh
          echo "EXTRA=install.sh" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            ${{ env.EXTRA }}
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.release-please.outputs.created == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release stays a draft until the packages are attached, so the
      # download links and the in-app update check never see it half done.
      - name: Attach packages and publish
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest
