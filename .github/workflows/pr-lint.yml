name: PR lint

# Conventional, lowercase PR title and commit subjects. Fast and runs for
# every PR (docs too), unlike the build.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read the title as it is now, not from the event: a re-run (see
      # dependabot-title.yml) must see a title fixed after the event.
      - name: PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          title=$(gh api "repos/$REPO/pulls/$PR" --jq .title)
          bash scripts/check-commit-title.sh "$title"

      # Dependabot's own commit subjects ("Bump ...") are skipped: they are
      # squashed away, and the merged commit takes the (fixed) PR title.
      - name: Commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while IFS="$(printf '\t')" read -r author subject; do
            [ -z "$subject" ] && continue
            [ "$author" = "dependabot[bot]" ] && continue
            bash scripts/check-commit-title.sh "$subject" || status=1
          done <<< "$(git log --format='%an%x09%s' "$BASE..$HEAD")"
          exit $status
