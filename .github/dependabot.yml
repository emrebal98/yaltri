# Weekly dependency updates.
#
# Cargo: compatible (patch) updates come together in one pull request;
# every other update gets its own, so CI shows exactly which crate breaks
# the build. For 0.x crates (most of ours) a minor bump such as 0.13 ->
# 0.14 is a breaking change in Cargo's semver.
#
# PR titles must be Conventional Commits in lowercase; Dependabot writes
# "Bump", and dependabot-title.yml lowercases it.
# `chore` and `ci` do not make a release on their own (release-please).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 6
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-patch:
        update-types: ["patch"]
    ignore:
      # Pinned exactly in Cargo.toml: GPUI is pre-1.0 and breaks between
      # snapshots, so it is upgraded by hand. Security updates still come.
      - dependency-name: gpui-kit

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
